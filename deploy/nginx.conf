# /etc/nginx/sites-available/qems -- symlink into sites-enabled.
#
# Single-origin setup: this box serves the built frontend AND proxies the API on the
# same host:port, so the browser never makes a cross-origin request in production --
# no CORS_ORIGINS juggling, no separate :3000/:8000 like local dev.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;  # a little above MAX_UPLOAD_SIZE_MB (15) for multipart overhead

    # Built frontend (frontend/dist -- built locally with VITE_API_URL=/api/v1, then
    # uploaded here; see deploy/DEPLOY.md).
    root /home/ubuntu/QEMS/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;  # client-side routing fallback
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }
}
